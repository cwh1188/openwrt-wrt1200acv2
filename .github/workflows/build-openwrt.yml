name: Build OpenWrt 23.05.6 WRT1200AC V2
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Build OpenWrt
        uses: P3TERX/Actions-OpenWrt@main
        with:
          openwrt_version: 23.05.6
          openwrt_target: mvebu
          openwrt_subtarget: cortexa9
          openwrt_profile: linksys_wrt1200ac-v2
          diy_script: diy.sh
          config_file: .config
