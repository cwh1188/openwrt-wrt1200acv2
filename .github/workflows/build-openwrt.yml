name: OpenWrt 23.05.6 WRT1200AC V2 PassWall

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Download OpenWrt ImageBuilder
        run: |
          wget https://downloads.openwrt.org/releases/23.05.6/targets/mvebu/cortexa9/openwrt-imagebuilder-23.05.6-mvebu-cortexa9.Linux-x86_64.tar.xz
          tar -xf openwrt-imagebuilder-23.05.6-mvebu-cortexa9.Linux-x86_64.tar.xz
          mv openwrt-imagebuilder-23.05.6-mvebu-cortexa9.Linux-x86_64 imagebuilder

      - name: Configure PassWall feed
        working-directory: imagebuilder
        run: |
          cat > repositories.conf <<'EOF'
          src/gz openwrt_core https://downloads.openwrt.org/releases/23.05.6/targets/mvebu/cortexa9/packages
          src/gz openwrt_base https://downloads.openwrt.org/releases/23.05.6/packages/arm_cortex-a9_vfpv3-d16/base
          src/gz openwrt_luci https://downloads.openwrt.org/releases/23.05.6/packages/arm_cortex-a9_vfpv3-d16/luci
          src/gz openwrt_packages https://downloads.openwrt.org/releases/23.05.6/packages/arm_cortex-a9_vfpv3-d16/packages
          src/gz openwrt_routing https://downloads.openwrt.org/releases/23.05.6/packages/arm_cortex-a9_vfpv3-d16/routing
          src/gz openwrt_telephony https://downloads.openwrt.org/releases/23.05.6/packages/arm_cortex-a9_vfpv3-d16/telephony
          src/gz passwall_packages https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-23.05/arm_cortex-a9_vfpv3-d16/passwall_packages
          src/gz passwall_luci https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-23.05/arm_cortex-a9_vfpv3-d16/passwall_luci
          EOF

      - name: Build firmware
        working-directory: imagebuilder
        run: |
          make image \
            PROFILE="linksys_wrt1200ac" \
            PACKAGES="\
            luci \
            luci-ssl \
            luci-app-firewall \
            luci-app-opkg \
            dnsmasq-full \
            kmod-nft-tproxy \
            kmod-nft-socket \
            nftables \
            luci-app-passwall \
            xray-core \
            tcping \
            resolveip \
            microsocks \
            "

      - name: Collect firmware
        run: |
          mkdir -p firmware
          cp imagebuilder/bin/targets/mvebu/cortexa9/* firmware/

      - name: Show firmware
        run: |
          ls -lh firmware
          sha256sum firmware/*

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-23.05.6-WRT1200AC-V2-PassWall
          path: firmware/
          retention-days: 30
