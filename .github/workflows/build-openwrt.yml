name: Build OpenWrt 23.05.6 WRT1200AC V2 - PassWall 1 VLESS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==================================================
      # 1. Checkout
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. Build dependencies
      # ==================================================
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            time \
            xsltproc \
            swig \
            libelf-dev \
            ecj \
            fastjar \
            java-propose-classpath \
            device-tree-compiler \
            zstd


      # ==================================================
      # 3. Download OpenWrt 23.05.6
      # ==================================================
      - name: Download OpenWrt 23.05.6
        run: |
          git clone \
            --depth 1 \
            --branch v23.05.6 \
            https://github.com/openwrt/openwrt.git \
            openwrt


      # ==================================================
      # 4. Configure PassWall package feeds
      #
      # PassWall 1
      # PassWall packages
      #
      # DO NOT use fake branch 25.9.23
      # ==================================================
      - name: Configure PassWall feeds
        working-directory: openwrt
        run: |

          echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main" >> feeds.conf.default

          echo "src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git;main" >> feeds.conf.default


      # ==================================================
      # 5. Update feeds
      # ==================================================
      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a


      # ==================================================
      # 6. Install feeds
      # ==================================================
      - name: Install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds install -a -f


      # ==================================================
      # 7. Replace Go with Go 25.x
      #
      # Required by current Xray
      # ==================================================
      - name: Update Go toolchain
        working-directory: openwrt
        run: |

          rm -rf feeds/packages/lang/golang

          git clone \
            --depth 1 \
            --branch 25.x \
            https://github.com/sbwml/packages_lang_golang.git \
            feeds/packages/lang/golang


      # ==================================================
      # 8. Configure OpenWrt
      # ==================================================
      - name: Configure OpenWrt
        working-directory: openwrt
        run: |

          cat > .config <<'EOF'

          # =================================================
          # TARGET
          # =================================================

          CONFIG_TARGET_mvebu=y
          CONFIG_TARGET_mvebu_cortexa9=y
          CONFIG_TARGET_mvebu_cortexa9_DEVICE_linksys_wrt1200ac=y


          # =================================================
          # LuCI
          # =================================================

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-opkg=y


          # =================================================
          # PassWall 1
          # =================================================

          CONFIG_PACKAGE_luci-app-passwall=y


          # =================================================
          # PassWall firewall
          #
          # OpenWrt 23.05 = firewall4 / nftables
          # =================================================

          CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y
          CONFIG_PACKAGE_luci-app-passwall_Iptables_Transparent_Proxy=n


          # =================================================
          # Xray
          #
          # ONLY Xray
          #
          # VLESS is handled by Xray
          # =================================================

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y


          # =================================================
          # Disable other proxy cores
          # =================================================

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=n

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin=n

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray_Plugin=n

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client=n

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Server=n

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client=n

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Server=n

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Simple_Obfs=n

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Haproxy=n

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria=n

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_NaiveProxy=n

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadow_TLS=n


          # =================================================
          # Disable extra GeoView
          #
          # Keep firmware smaller
          # =================================================

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geoview=n

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Geodata=n


          # =================================================
          # PassWall required packages
          # =================================================

          CONFIG_PACKAGE_coreutils=y
          CONFIG_PACKAGE_coreutils-base64=y
          CONFIG_PACKAGE_coreutils-nohup=y
          CONFIG_PACKAGE_coreutils-timeout=y

          CONFIG_PACKAGE_curl=y

          CONFIG_PACKAGE_dnsmasq-full=y

          CONFIG_PACKAGE_ip-full=y

          CONFIG_PACKAGE_microsocks=y

          CONFIG_PACKAGE_resolveip=y

          CONFIG_PACKAGE_tcping=y

          CONFIG_PACKAGE_lua=y

          CONFIG_PACKAGE_luci-compat=y

          CONFIG_PACKAGE_luci-lib-jsonc=y

          CONFIG_PACKAGE_lyaml=y


          # =================================================
          # nftables / TProxy
          # =================================================

          CONFIG_PACKAGE_nftables=y

          CONFIG_PACKAGE_kmod-nft-socket=y

          CONFIG_PACKAGE_kmod-nft-tproxy=y

          CONFIG_PACKAGE_kmod-nft-nat=y

          CONFIG_PACKAGE_kmod-nf-reject=y

          CONFIG_PACKAGE_kmod-nf-reject6=y


          # =================================================
          # Normal package manager
          # =================================================

          CONFIG_PACKAGE_opkg=y

          EOF


      # ==================================================
      # 9. Generate final configuration
      # ==================================================
      - name: Generate defconfig
        working-directory: openwrt
        run: |
          make defconfig


      # ==================================================
      # 10. Verify configuration
      # ==================================================
      - name: Verify configuration
        working-directory: openwrt
        run: |

          echo
          echo "=============================================="
          echo "TARGET"
          echo "=============================================="

          grep -E \
            'CONFIG_TARGET_mvebu|CONFIG_TARGET.*wrt1200ac' \
            .config || true


          echo
          echo "=============================================="
          echo "PASSWALL"
          echo "=============================================="

          grep -E \
            'CONFIG_PACKAGE_luci-app-passwall|passwall_INCLUDE|CONFIG_PACKAGE_xray-core' \
            .config || true


          echo
          echo "=============================================="
          echo "DISABLED CORES"
          echo "=============================================="

          grep -E \
            'INCLUDE_SingBox|INCLUDE_Hysteria|INCLUDE_NaiveProxy|INCLUDE_Haproxy|INCLUDE_Shadowsocks|INCLUDE_ShadowsocksR|INCLUDE_Simple_Obfs|INCLUDE_Geoview' \
            .config || true


          echo
          echo "=============================================="
          echo "GO TOOLCHAIN"
          echo "=============================================="

          grep -E \
            'GO_VERSION|GO_DEFAULT_VERSION' \
            feeds/packages/lang/golang/golang-values.mk || true


          echo
          echo "=============================================="
          echo "XRAY"
          echo "=============================================="

          grep -R \
            'PKG_VERSION' \
            feeds/packages/net/xray-core/Makefile \
            feeds/passwall_packages/net/xray-core/Makefile \
            2>/dev/null || true


      # ==================================================
      # 11. Download sources
      # ==================================================
      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j4 V=s


      # ==================================================
      # 12. Build firmware
      # ==================================================
      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j2 V=s


      # ==================================================
      # 13. Collect firmware
      # ==================================================
      - name: Collect firmware
        if: success()
        run: |

          mkdir -p firmware

          find openwrt/bin/targets/mvebu/cortexa9/ \
            -type f \
            \( \
              -name "*wrt1200ac*" \
              -o -name "sha256sums" \
            \) \
            -exec cp {} firmware/ \;


      # ==================================================
      # 14. Show firmware
      # ==================================================
      - name: Show firmware information
        if: success()
        run: |

          echo
          echo "=============================================="
          echo "FIRMWARE"
          echo "=============================================="

          ls -lh firmware/


          echo
          echo "=============================================="
          echo "SHA256"
          echo "=============================================="

          cd firmware

          sha256sum * || true


      # ==================================================
      # 15. Upload firmware
      # ==================================================
      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-23.05.6-WRT1200AC-V2-PassWall1-VLESS
          path: firmware/
          retention-days: 30
