name: Build OpenWrt 23.05.6 WRT1200AC V2 - PassWall VLESS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==================================================
      # 1. Checkout
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. Build dependencies
      # ==================================================
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            time \
            xsltproc \
            swig \
            libelf-dev \
            ecj \
            fastjar \
            java-propose-classpath \
            qemu-utils \
            device-tree-compiler \
            zstd


      # ==================================================
      # 3. OpenWrt 23.05.6
      # ==================================================
      - name: Download OpenWrt 23.05.6
        run: |
          git clone \
            --depth 1 \
            --branch v23.05.6 \
            https://github.com/openwrt/openwrt.git \
            openwrt


      # ==================================================
      # 4. Add PassWall 1
      #
      # PassWall 1
      # Xray
      # VLESS
      # ==================================================
      - name: Add PassWall 1
        working-directory: openwrt
        run: |

          git clone \
            --depth 1 \
            --branch 25.9.23 \
            https://github.com/Openwrt-Passwall/openwrt-passwall.git \
            package/passwall


      # ==================================================
      # 5. Update official feeds
      # ==================================================
      - name: Update OpenWrt feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a


      # ==================================================
      # 6. Install official feeds
      # ==================================================
      - name: Install OpenWrt feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds install -a -f


      # ==================================================
      # 7. Replace Go
      #
      # OpenWrt 23.05 original Go is too old.
      #
      # Xray 25.9.11 requires Go 1.25.x
      # ==================================================
      - name: Update Go 25.x
        working-directory: openwrt
        run: |

          rm -rf feeds/packages/lang/golang

          git clone \
            --depth 1 \
            --branch 25.x \
            https://github.com/sbwml/packages_lang_golang \
            feeds/packages/lang/golang


      # ==================================================
      # 8. Remove OpenWrt Xray
      #
      # We will build Xray 25.9.11 ourselves.
      # This prevents OpenWrt from pulling a newer
      # incompatible Xray version.
      # ==================================================
      - name: Remove OpenWrt Xray package
        working-directory: openwrt
        run: |

          rm -rf feeds/packages/net/xray-core


      # ==================================================
      # 9. Create Xray 25.9.11 package
      # ==================================================
      - name: Create Xray 25.9.11 package
        working-directory: openwrt
        run: |

          mkdir -p package/xray-core

          cat > package/xray-core/Makefile <<'EOF'
          include $(TOPDIR)/rules.mk

          PKG_NAME:=xray-core
          PKG_VERSION:=25.9.11
          PKG_RELEASE:=1

          PKG_SOURCE_PROTO:=git
          PKG_SOURCE_URL:=https://github.com/XTLS/Xray-core.git
          PKG_SOURCE_VERSION:=v25.9.11
          PKG_SOURCE_SUBDIR:=Xray-core-$(PKG_VERSION)

          PKG_MAINTAINER:=Xray Project
          PKG_LICENSE:=MPL-2.0
          PKG_LICENSE_FILES:=LICENSE

          PKG_BUILD_DEPENDS:=golang/host
          PKG_BUILD_PARALLEL:=1
          PKG_USE_MIPS16:=0
          PKG_BUILD_FLAGS:=no-mips16

          GO_PKG:=github.com/xtls/xray-core
          GO_PKG_BUILD_PKG:=$(GO_PKG)/main

          GO_PKG_LDFLAGS_X:= \
              $(GO_PKG)/core.build=OpenWrt \
              $(GO_PKG)/core.version=$(PKG_VERSION)

          include $(INCLUDE_DIR)/package.mk
          include $(TOPDIR)/feeds/packages/lang/golang/golang-package.mk

          define Package/xray-core
            SECTION:=net
            CATEGORY:=Network
            TITLE:=Xray core
            URL:=https://github.com/XTLS/Xray-core
            DEPENDS:=$(GO_ARCH_DEPENDS) +ca-bundle
          endef

          define Package/xray-core/description
            Xray core proxy engine.
          endef

          define Package/xray-core/conffiles
          /etc/xray/
          /etc/config/xray
          endef

          define Package/xray-core/install
            $(call GoPackage/Package/Install/Bin,$(PKG_INSTALL_DIR))
            $(INSTALL_DIR) $(1)/usr/bin
            $(INSTALL_BIN) $(PKG_INSTALL_DIR)/usr/bin/main $(1)/usr/bin/xray
          endef

          $(eval $(call BuildPackage,xray-core))
          EOF


      # ==================================================
      # 10. Install PassWall
      # ==================================================
      - name: Install PassWall
        working-directory: openwrt
        run: |

          ./scripts/feeds install luci-app-passwall
          ./scripts/feeds install luci-i18n-passwall-zh-cn


      # ==================================================
      # 11. Configure firmware
      # ==================================================
      - name: Configure OpenWrt
        working-directory: openwrt
        run: |

          cat > .config <<'EOF'

          # =================================================
          # TARGET
          # =================================================

          CONFIG_TARGET_mvebu=y
          CONFIG_TARGET_mvebu_cortexa9=y
          CONFIG_TARGET_mvebu_cortexa9_DEVICE_linksys_wrt1200ac=y


          # =================================================
          # LuCI
          # =================================================

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-opkg=y


          # =================================================
          # PassWall 1
          # =================================================

          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y


          # =================================================
          # PassWall firewall
          #
          # OpenWrt 23.05 = firewall4 / nftables
          # =================================================

          CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y
          CONFIG_PACKAGE_luci-app-passwall_Iptables_Transparent_Proxy=n


          # =================================================
          # Xray
          #
          # ONLY Xray
          #
          # VLESS -> Xray
          # =================================================

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray_Plugin=n

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Server=n

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Server=n

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Simple_Obfs=n

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Haproxy=n

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria=n

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_NaiveProxy=n

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadow_TLS=n

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geoview=n

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Geodata=y


          # =================================================
          # Xray package
          # =================================================

          CONFIG_PACKAGE_xray-core=y


          # =================================================
          # nftables / TProxy
          # =================================================

          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-nat=y

          CONFIG_PACKAGE_kmod-nf-reject=y
          CONFIG_PACKAGE_kmod-nf-reject6=y


          # =================================================
          # DNS
          # =================================================

          CONFIG_PACKAGE_dnsmasq-full=y


          # =================================================
          # PassWall dependencies
          # =================================================

          CONFIG_PACKAGE_coreutils=y
          CONFIG_PACKAGE_coreutils-base64=y
          CONFIG_PACKAGE_coreutils-nohup=y
          CONFIG_PACKAGE_coreutils-timeout=y

          CONFIG_PACKAGE_curl=y

          CONFIG_PACKAGE_ip-full=y

          CONFIG_PACKAGE_resolveip=y

          CONFIG_PACKAGE_tcping=y

          CONFIG_PACKAGE_unzip=y


          # =================================================
          # V2Ray GeoData
          # =================================================

          CONFIG_PACKAGE_v2ray-geoip=y
          CONFIG_PACKAGE_v2ray-geosite=y


          # =================================================
          # Normal package manager
          # =================================================

          CONFIG_PACKAGE_opkg=y

          EOF


      # ==================================================
      # 12. Defconfig
      # ==================================================
      - name: Generate defconfig
        working-directory: openwrt
        run: |

          make defconfig


      # ==================================================
      # 13. Verify configuration
      # ==================================================
      - name: Verify configuration
        working-directory: openwrt
        run: |

          echo
          echo "=============================================="
          echo "TARGET"
          echo "=============================================="

          grep -E \
            'CONFIG_TARGET_mvebu|CONFIG_TARGET.*wrt1200ac' \
            .config || true


          echo
          echo "=============================================="
          echo "PASSWALL"
          echo "=============================================="

          grep -E \
            'luci-app-passwall|passwall_INCLUDE|xray-core|sing-box|v2ray-plugin' \
            .config || true


          echo
          echo "=============================================="
          echo "GO"
          echo "=============================================="

          grep -E \
            'GO_VERSION|GO_DEFAULT_VERSION' \
            feeds/packages/lang/golang/golang-values.mk || true


          echo
          echo "=============================================="
          echo "XRAY PACKAGE"
          echo "=============================================="

          grep -E \
            'PKG_VERSION|PKG_SOURCE_VERSION' \
            package/xray-core/Makefile


      # ==================================================
      # 14. Download source
      # ==================================================
      - name: Download sources
        working-directory: openwrt
        run: |

          make download -j4 V=s


      # ==================================================
      # 15. Build firmware
      # ==================================================
      - name: Build firmware
        working-directory: openwrt
        run: |

          make -j2 V=s


      # ==================================================
      # 16. Collect firmware
      # ==================================================
      - name: Collect firmware
        if: success()
        run: |

          mkdir -p firmware

          find openwrt/bin/targets/mvebu/cortexa9/ \
            -type f \
            \( \
              -name "*wrt1200ac*" \
              -o -name "sha256sums" \
            \) \
            -exec cp {} firmware/ \;


      # ==================================================
      # 17. Show firmware
      # ==================================================
      - name: Show firmware information
        if: success()
        run: |

          echo
          echo "=============================================="
          echo "FIRMWARE"
          echo "=============================================="

          ls -lh firmware/


          echo
          echo "=============================================="
          echo "SHA256"
          echo "=============================================="

          cd firmware

          sha256sum * || true


      # ==================================================
      # 18. Upload
      # ==================================================
      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-23.05.6-WRT1200AC-V2-PassWall-VLESS
          path: firmware/
          retention-days: 30
