name: Build OpenWrt 23.05.6 for WRT1200AC V2

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            libelf-dev \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            subversion \
            swig \
            time \
            xsltproc

      - name: Download OpenWrt 23.05.6
        run: |
          git clone --depth 1 \
            --branch v23.05.6 \
            https://github.com/openwrt/openwrt.git openwrt

      - name: Add PassWall 26.3.6
        working-directory: openwrt
        run: |
          rm -rf feeds/packages/net/{xray-core,v2ray-geodata,sing-box,chinadns-ng,dns2socks,hysteria,ipt2socks,microsocks,naiveproxy,shadowsocks-rust,shadowsocksr-libev,simple-obfs,tcping,v2ray-plugin,xray-plugin,geoview,shadow-tls}
          rm -rf feeds/luci/applications/luci-app-passwall

          git clone --depth 1 \
            --branch 26.3.6-1 \
            https://github.com/Openwrt-Passwall/openwrt-passwall.git \
            package/passwall-luci

          git clone --depth 1 \
            https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git \
            package/passwall-packages

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Use newer Go toolchain
        working-directory: openwrt
        run: |
          rm -rf feeds/packages/lang/golang
          rm -rf package/feeds/packages/golang

          git clone --depth 1 \
            --branch 25.x \
            https://github.com/sbwml/packages_lang_golang.git \
            feeds/packages/lang/golang

          ln -sf ../../feeds/packages/lang/golang package/feeds/packages/golang

      - name: Set default LuCI language to Chinese
        working-directory: openwrt
        run: |
          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-default-lang <<'EOF'
          #!/bin/sh
          uci set luci.main.lang='zh_cn'
          uci commit luci
          exit 0
          EOF

          chmod +x files/etc/uci-defaults/99-default-lang

      - name: Set default LAN IP to 192.168.23.1
        working-directory: openwrt
        run: |
          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/98-lan-ip <<'EOF'
          #!/bin/sh
          uci set network.lan.ipaddr='192.168.23.1'
          uci commit network
          exit 0
          EOF

          chmod +x files/etc/uci-defaults/98-lan-ip

      - name: Configure firmware
        working-directory: openwrt
        run: |

          cat > .config <<'EOF'

          CONFIG_TARGET_mvebu=y
          CONFIG_TARGET_mvebu_cortexa9=y
          CONFIG_TARGET_mvebu_cortexa9_DEVICE_linksys_wrt1200ac=y

          # ===== LuCI 基础 =====
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y

          # ===== 高级重启 / 双分区 =====
          CONFIG_PACKAGE_luci-app-advanced-reboot=y
          CONFIG_PACKAGE_luci-i18n-advanced-reboot-zh-cn=y

          # ===== Web 终端 =====
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y

          # ===== PassWall =====
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y

          # 使用 Sing-box
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y
          CONFIG_PACKAGE_sing-box=y

          # 不使用 Xray
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=n
          CONFIG_PACKAGE_xray-core=n

          # 不使用其他代理核心
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Trojan_Plus=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Libev_Client=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_NaiveProxy=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Simple_Obfs=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray_Plugin=n

          # ===== PassWall DNS =====
          CONFIG_PACKAGE_dnsmasq=n
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_chinadns-ng=y
          CONFIG_PACKAGE_dns2socks=y
          CONFIG_PACKAGE_ipt2socks=y

          # ===== nftables / TProxy =====
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables-json=y
          CONFIG_PACKAGE_kmod-nf-socket=y
          CONFIG_PACKAGE_kmod-nf-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-tun=y

          # ===== 基础网络 =====
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_tcpdump-mini=y

          EOF

          make defconfig

      - name: Verify configuration
        working-directory: openwrt
        run: |

          echo "===== TARGET ====="
          grep '^CONFIG_TARGET_mvebu_cortexa9_DEVICE_linksys_wrt1200ac=y$' .config

          echo "===== PASSWALL ====="
          grep '^CONFIG_PACKAGE_luci-app-passwall=y$' .config

          echo "===== SING-BOX ====="
          grep '^CONFIG_PACKAGE_sing-box=y$' .config

          echo "===== XRAY MUST BE DISABLED ====="
          if grep -q '^CONFIG_PACKAGE_xray-core=y$' .config; then
            echo "ERROR: Xray is enabled."
            exit 1
          fi

          echo "===== DNSMASQ ====="
          grep -E '^CONFIG_PACKAGE_dnsmasq(-full)?=' .config

          if grep -q '^CONFIG_PACKAGE_dnsmasq=y$' .config; then
            echo "ERROR: normal dnsmasq is enabled."
            exit 1
          fi

          if ! grep -q '^CONFIG_PACKAGE_dnsmasq-full=y$' .config; then
            echo "ERROR: dnsmasq-full is not enabled."
            exit 1
          fi

          echo "===== TPROXY ====="
          grep '^CONFIG_PACKAGE_kmod-nf-socket=y$' .config
          grep '^CONFIG_PACKAGE_kmod-nf-tproxy=y$' .config
          grep '^CONFIG_PACKAGE_kmod-nft-socket=y$' .config
          grep '^CONFIG_PACKAGE_kmod-nft-tproxy=y$' .config
          grep '^CONFIG_PACKAGE_kmod-tun=y$' .config

          echo "===== ADVANCED REBOOT ====="
          grep '^CONFIG_PACKAGE_luci-app-advanced-reboot=y$' .config

          echo "===== TTYD ====="
          grep '^CONFIG_PACKAGE_luci-app-ttyd=y$' .config

          echo "===== CONFIGURATION CHECK PASSED ====="

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j4 V=s

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j2 V=s

      - name: Collect firmware
        run: |
          mkdir -p artifact

          find openwrt/bin/targets/mvebu/cortexa9 \
            -maxdepth 1 \
            -type f \
            -exec cp {} artifact/ \;

          echo "===== FIRMWARE FILES ====="
          ls -lh artifact/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-23.05.6-wrt1200acv2-passwall-singbox
          path: artifact/
          retention-days: 7
