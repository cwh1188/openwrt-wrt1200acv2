name: Build OpenWrt 23.05.6 for WRT1200AC V2

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:

      # ============================================================
      # 1. Build dependencies
      # ============================================================

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            subversion \
            swig \
            time \
            xsltproc \
            libelf-dev \
            libtool \
            autoconf \
            automake

      # ============================================================
      # 2. OpenWrt 23.05.6
      # ============================================================

      - name: Download OpenWrt 23.05.6
        run: |
          git clone --depth 1 \
            --branch v23.05.6 \
            https://github.com/openwrt/openwrt.git openwrt

      # ============================================================
      # 3. PassWall official feeds
      # ============================================================

      - name: Add PassWall feeds
        working-directory: openwrt
        run: |
          echo 'src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' >> feeds.conf.default
          echo 'src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git;main' >> feeds.conf.default

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # 4. Use newer Go toolchain
      # ============================================================

      - name: Use newer Go toolchain for Xray
        working-directory: openwrt
        run: |
          rm -rf feeds/packages/lang/golang

          git clone --depth 1 \
            --branch 25.x \
            https://github.com/sbwml/packages_lang_golang.git \
            feeds/packages/lang/golang

          rm -rf package/feeds/packages/golang

          ./scripts/feeds update packages
          ./scripts/feeds install golang

      # ============================================================
      # 5. Set default LuCI language
      # ============================================================

      - name: Set default LuCI language to Chinese
        working-directory: openwrt
        run: |
          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-default-lang <<'EOF'
          #!/bin/sh
          uci set luci.main.lang='zh_cn'
          uci commit luci
          exit 0
          EOF

          chmod +x files/etc/uci-defaults/99-default-lang

      # ============================================================
      # 6. Default LAN IP
      # ============================================================

      - name: Set default LAN IP to 192.168.23.1
        working-directory: openwrt
        run: |
          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/98-lan-ip <<'EOF'
          #!/bin/sh
          uci set network.lan.ipaddr='192.168.23.1'
          uci commit network
          exit 0
          EOF

          chmod +x files/etc/uci-defaults/98-lan-ip

      # ============================================================
      # 7. Configure firmware
      # ============================================================

      - name: Configure firmware
        working-directory: openwrt
        run: |

          cat > .config <<'EOF'

          # ========================================================
          # TARGET
          # ========================================================

          CONFIG_TARGET_mvebu=y
          CONFIG_TARGET_mvebu_cortexa9=y
          CONFIG_TARGET_mvebu_cortexa9_DEVICE_linksys_wrt1200ac=y

          # ========================================================
          # LuCI
          # ========================================================

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y

          # ========================================================
          # PassWall
          # ========================================================

          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y

          # ========================================================
          # Xray
          #
          # Use PassWall package tree Xray.
          # DO NOT use old OpenWrt feeds/packages Xray.
          # ========================================================

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y
          CONFIG_PACKAGE_xray-core=y

          # ========================================================
          # PassWall transparent proxy
          #
          # Do not force the old iptables-only configuration.
          # Keep nftables/TProxy support available.
          # ========================================================

          CONFIG_PACKAGE_luci-app-passwall_Iptables_Transparent_Proxy=y
          CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y

          # ========================================================
          # nftables / TProxy kernel modules
          # ========================================================

          CONFIG_PACKAGE_kmod-nft-core=y
          CONFIG_PACKAGE_kmod-nft-fib=y
          CONFIG_PACKAGE_kmod-nft-nat=y
          CONFIG_PACKAGE_kmod-nft-offload=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y

          # ========================================================
          # TUN
          # ========================================================

          CONFIG_PACKAGE_kmod-tun=y

          # ========================================================
          # DNS
          #
          # PassWall requires dnsmasq-full.
          # ========================================================

          CONFIG_PACKAGE_dnsmasq=n
          CONFIG_PACKAGE_dnsmasq-full=y

          # ========================================================
          # Web terminal
          # ========================================================

          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y

          # ========================================================
          # USB / storage
          # ========================================================

          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-fs-ext4=y

          # ========================================================
          # Python
          # ========================================================

          CONFIG_PACKAGE_python3=y
          CONFIG_PACKAGE_python3-base=y
          CONFIG_PACKAGE_python3-light=y

          # ========================================================
          # Network tools
          # ========================================================

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_ip-full=y

          # ========================================================
          # Disable unnecessary proxy cores
          # ========================================================

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Trojan_Plus=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Libev_Client=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_NaiveProxy=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Simple_Obfs=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray_Plugin=n

          EOF

          # ========================================================
          # Generate final configuration
          # ========================================================

          make defconfig

      # ============================================================
      # 8. Verify configuration
      # ============================================================

      - name: Verify configuration
        working-directory: openwrt
        run: |

          echo "=================================================="
          echo " TARGET"
          echo "=================================================="

          grep '^CONFIG_TARGET_mvebu_cortexa9_DEVICE_linksys_wrt1200ac=y$' .config

          echo
          echo "=================================================="
          echo " PASSWALL"
          echo "=================================================="

          grep '^CONFIG_PACKAGE_luci-app-passwall=y$' .config
          grep '^CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y$' .config

          echo
          echo "=================================================="
          echo " XRAY"
          echo "=================================================="

          grep '^CONFIG_PACKAGE_xray-core=y$' .config

          echo
          echo "=================================================="
          echo " NFTABLES / TPROXY"
          echo "=================================================="

          grep '^CONFIG_PACKAGE_kmod-nft-socket=y$' .config
          grep '^CONFIG_PACKAGE_kmod-nft-tproxy=y$' .config

          echo
          echo "=================================================="
          echo " DNSMASQ"
          echo "=================================================="

          grep -E '^CONFIG_PACKAGE_dnsmasq(-full)?=' .config

          if grep -q '^CONFIG_PACKAGE_dnsmasq=y$' .config; then
            echo "ERROR: normal dnsmasq is enabled."
            exit 1
          fi

          if ! grep -q '^CONFIG_PACKAGE_dnsmasq-full=y$' .config; then
            echo "ERROR: dnsmasq-full is not enabled."
            exit 1
          fi

          echo
          echo "=================================================="
          echo " XRAY PACKAGE SOURCE"
          echo "=================================================="

          find package/feeds -path '*xray-core/Makefile' -print 2>/dev/null || true
          find package/passwall-packages -path '*xray-core/Makefile' -print 2>/dev/null || true

          echo
          echo "=================================================="
          echo " XRAY VERSION"
          echo "=================================================="

          grep -R 'PKG_VERSION' \
            package/passwall-packages/xray-core/Makefile \
            package/feeds/passwall_packages/xray-core/Makefile \
            2>/dev/null | head -10 || true

          echo
          echo "=================================================="
          echo " PASSWALL VERSION"
          echo "=================================================="

          grep -E 'PKG_VERSION|PKG_RELEASE' \
            package/passwall-luci/luci-app-passwall/Makefile \
            package/feeds/passwall/luci-app-passwall/Makefile \
            2>/dev/null | head -10 || true

          echo
          echo "=================================================="
          echo " CONFIGURATION CHECK PASSED"
          echo "=================================================="

      # ============================================================
      # 9. Download sources
      # ============================================================

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j4 V=s

      # ============================================================
      # 10. Build
      # ============================================================

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j2 V=s

      # ============================================================
      # 11. Collect firmware
      # ============================================================

      - name: Collect firmware
        run: |
          mkdir -p artifact

          find openwrt/bin/targets/mvebu/cortexa9 \
            -maxdepth 1 \
            -type f \
            -exec cp {} artifact/ \;

          echo "=================================================="
          echo " FIRMWARE FILES"
          echo "=================================================="

          ls -lh artifact/

      # ============================================================
      # 12. Upload firmware
      # ============================================================

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-23.05.6-wrt1200acv2-passwall-vless
          path: artifact/
          retention-days: 7
