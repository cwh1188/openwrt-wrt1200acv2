name: Build OpenWrt 23.05.6 for WRT1200AC V2

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            subversion \
            swig \
            time \
            xsltproc

      - name: Download OpenWrt 23.05.6
        run: |
          git clone --depth 1 \
            --branch v23.05.6 \
            https://github.com/openwrt/openwrt.git openwrt

      - name: Add PassWall feeds
        working-directory: openwrt
        run: |
          echo 'src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' >> feeds.conf.default
          echo 'src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git;main' >> feeds.conf.default

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Use newer Go toolchain for Xray
        working-directory: openwrt
        run: |
          rm -rf feeds/packages/lang/golang

          git clone --depth 1 \
            --branch 25.x \
            https://github.com/sbwml/packages_lang_golang.git \
            feeds/packages/lang/golang

      - name: Set default LuCI language to Chinese
        working-directory: openwrt
        run: |
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-default-lang <<'EOF'
          #!/bin/sh
          uci set luci.main.lang='zh_cn'
          uci commit luci
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-default-lang

      - name: Set default LAN IP to 192.168.23.1
        working-directory: openwrt
        run: |
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/98-lan-ip <<'EOF'
          #!/bin/sh
          uci set network.lan.ipaddr='192.168.23.1'
          uci commit network
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/98-lan-ip

      - name: Configure firmware
        working-directory: openwrt
        run: |

          cat > .config <<'EOF'

          CONFIG_TARGET_mvebu=y
          CONFIG_TARGET_mvebu_cortexa9=y
          CONFIG_TARGET_mvebu_cortexa9_DEVICE_linksys_wrt1200ac=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y

          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y
          CONFIG_PACKAGE_xray-core=y

          # 改用传统 iptables 透明代理方案（兼容当前稳定版 Xray），关闭新版 nftables 方案
          CONFIG_PACKAGE_luci-app-passwall_Iptables_Transparent_Proxy=y
          CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=n

          # 网页终端
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y

          # PassWall uses dnsmasq-full.
          # Do NOT build the normal dnsmasq package.
          CONFIG_PACKAGE_dnsmasq=n
          CONFIG_PACKAGE_dnsmasq-full=y

          # Disable unnecessary proxy cores.
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Trojan_Plus=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Libev_Client=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_NaiveProxy=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Simple_Obfs=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray_Plugin=n

          EOF

          make defconfig

      - name: Verify configuration
        working-directory: openwrt
        run: |

          echo "===== TARGET ====="
          grep '^CONFIG_TARGET_mvebu_cortexa9_DEVICE_linksys_wrt1200ac=y$' .config

          echo "===== PASSWALL ====="
          grep '^CONFIG_PACKAGE_luci-app-passwall=y$' .config

          echo "===== XRAY ====="
          grep '^CONFIG_PACKAGE_xray-core=y$' .config

          echo "===== TTYD ====="
          grep '^CONFIG_PACKAGE_luci-app-ttyd=y$' .config

          echo "===== TRANSPARENT PROXY MODE (must be Iptables=y, Nftables=n) ====="
          grep '^CONFIG_PACKAGE_luci-app-passwall_Iptables_Transparent_Proxy' .config
          grep '^CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy' .config

          if ! grep -q '^CONFIG_PACKAGE_luci-app-passwall_Iptables_Transparent_Proxy=y$' .config; then
            echo "ERROR: Iptables_Transparent_Proxy was NOT enabled. Build stopped."
            exit 1
          fi

          if grep -q '^CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y$' .config; then
            echo "ERROR: Nftables_Transparent_Proxy is still enabled. Build stopped."
            exit 1
          fi

          echo "TRANSPARENT PROXY MODE CHECK PASSED"

          echo "===== DNSMASQ ====="
          grep -E '^CONFIG_PACKAGE_dnsmasq(-full)?=' .config || true

          if grep -q '^CONFIG_PACKAGE_dnsmasq=y$' .config; then
            echo "ERROR: normal dnsmasq is enabled."
            exit 1
          fi

          if ! grep -q '^CONFIG_PACKAGE_dnsmasq-full=y$' .config; then
            echo "ERROR: dnsmasq-full is not enabled."
            exit 1
          fi

          echo "DNSMASQ CHECK PASSED"

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j4 V=s

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j2 V=s

      - name: Collect firmware
        run: |
          mkdir -p artifact

          find openwrt/bin/targets/mvebu/cortexa9 \
            -maxdepth 1 \
            -type f \
            -exec cp {} artifact/ \;

          echo "===== FIRMWARE FILES ====="
          ls -lh artifact/
          
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-23.05.6-wrt1200acv2
          path: artifact/
          retention-days: 7
