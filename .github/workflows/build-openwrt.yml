name: Build OpenWrt 23.05.6 WRT1200AC V2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Install build dependencies
      # --------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            time \
            xsltproc \
            swig \
            libelf-dev \
            ecj \
            fastjar \
            java-propose-classpath \
            qemu-utils \
            device-tree-compiler


      # --------------------------------------------------
      # 3. Download OpenWrt 23.05.6
      # --------------------------------------------------
      - name: Download OpenWrt 23.05.6
        run: |
          git clone \
            --depth 1 \
            --branch v23.05.6 \
            https://github.com/openwrt/openwrt.git \
            openwrt


      # --------------------------------------------------
      # 4. Add PassWall2 stable release
      #
      # PassWall2:
      # 26.9.9-2
      #
      # Xray:
      # 26.9.9
      #
      # VLESS is supported by Xray/PassWall2.
      # --------------------------------------------------
      - name: Configure PassWall2 feeds
        working-directory: openwrt
        run: |
          cat >> feeds.conf.default <<'EOF'

          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git;26.9.9-2
          EOF


      # --------------------------------------------------
      # 5. Update feeds
      # --------------------------------------------------
      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a


      # --------------------------------------------------
      # 6. Install PassWall packages first
      # --------------------------------------------------
      - name: Install PassWall dependencies
        working-directory: openwrt
        run: |
          ./scripts/feeds install -a -f -p passwall_packages


      # --------------------------------------------------
      # 7. Install PassWall2
      # --------------------------------------------------
      - name: Install PassWall2
        working-directory: openwrt
        run: |
          ./scripts/feeds install luci-app-passwall2
          ./scripts/feeds install luci-i18n-passwall2-zh-cn


      # --------------------------------------------------
      # 8. Configure WRT1200AC V2
      #
      # WRT1200AC V1/V2 use:
      #
      # target      = mvebu
      # subtarget   = cortexa9
      # profile     = linksys_wrt1200ac
      # --------------------------------------------------
      - name: Configure OpenWrt
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'

          # ------------------------------------------------
          # Target
          # ------------------------------------------------

          CONFIG_TARGET_mvebu=y
          CONFIG_TARGET_mvebu_cortexa9=y
          CONFIG_TARGET_mvebu_cortexa9_DEVICE_linksys_wrt1200ac=y


          # ------------------------------------------------
          # LuCI
          # ------------------------------------------------

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-opkg=y


          # ------------------------------------------------
          # PassWall2
          # ------------------------------------------------

          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=y


          # ------------------------------------------------
          # PassWall2 basic dependencies
          # ------------------------------------------------

          CONFIG_PACKAGE_coreutils=y
          CONFIG_PACKAGE_coreutils-base64=y
          CONFIG_PACKAGE_coreutils-nohup=y

          CONFIG_PACKAGE_curl=y

          CONFIG_PACKAGE_ip-full=y

          CONFIG_PACKAGE_resolveip=y

          CONFIG_PACKAGE_tcping=y

          CONFIG_PACKAGE_unzip=y


          # ------------------------------------------------
          # Firewall / Transparent Proxy
          # ------------------------------------------------

          CONFIG_PACKAGE_dnsmasq-full=y

          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-nat=y


          # ------------------------------------------------
          # VLESS / Xray
          #
          # Xray is the only proxy core built into firmware.
          #
          # Sing-box / SSR / Shadowsocks-Rust /
          # Hysteria / NaiveProxy are NOT built in.
          # ------------------------------------------------

          CONFIG_PACKAGE_xray-core=y


          # ------------------------------------------------
          # Geo data required by PassWall2
          # ------------------------------------------------

          CONFIG_PACKAGE_v2ray-geoip=y
          CONFIG_PACKAGE_v2ray-geosite=y
          CONFIG_PACKAGE_geoview=y


          # ------------------------------------------------
          # Normal OpenWrt package management
          # ------------------------------------------------

          CONFIG_PACKAGE_opkg=y

          EOF

          make defconfig


      # --------------------------------------------------
      # 9. Display important configuration
      # --------------------------------------------------
      - name: Show configuration
        working-directory: openwrt
        run: |
          echo "========================================"
          echo "OpenWrt target:"
          echo "mvebu / cortexa9 / Linksys WRT1200AC"
          echo "========================================"

          echo
          echo "PassWall2:"
          grep -E \
            'PASSWALL|xray-core|v2ray-geoip|v2ray-geosite' \
            .config || true

          echo
          echo "Target:"
          grep -E \
            'CONFIG_TARGET_mvebu|CONFIG_TARGET.*wrt1200ac' \
            .config || true


      # --------------------------------------------------
      # 10. Download sources
      # --------------------------------------------------
      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j4 V=s


      # --------------------------------------------------
      # 11. Build firmware
      # --------------------------------------------------
      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j2 V=s


      # --------------------------------------------------
      # 12. Collect firmware
      # --------------------------------------------------
      - name: Collect firmware
        run: |
          mkdir -p firmware

          find openwrt/bin/targets/mvebu/cortexa9/ \
            -type f \
            \( \
              -name "*wrt1200ac*" \
              -o -name "sha256sums" \
            \) \
            -exec cp {} firmware/ \;


      # --------------------------------------------------
      # 13. Show firmware
      # --------------------------------------------------
      - name: Show firmware information
        run: |
          echo
          echo "========================================"
          echo "Firmware files"
          echo "========================================"

          ls -lh firmware/

          echo
          echo "========================================"
          echo "SHA256"
          echo "========================================"

          cd firmware
          sha256sum * || true


      # --------------------------------------------------
      # 14. Upload firmware
      # --------------------------------------------------
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-23.05.6-WRT1200AC-V2-PassWall2-VLESS
          path: firmware/
          retention-days: 30
